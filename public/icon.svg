<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#blueGrad)"/>

  <!-- Subtle glow ring -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>

  <!-- Toolbox Body -->
  <g transform="translate(96, 116)">
    <!-- Tool Handle -->
    <path d="M104 56 C104 25, 129 0, 160 0 L160 0 C191 0, 216 25, 216 56 L216 72 L104 72 Z" 
          fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Chest / Box Lid -->
    <rect x="0" y="72" width="320" height="96" rx="28" fill="#1e40af"/>
    <rect x="0" y="72" width="320" height="96" rx="28" fill="none" stroke="#ffffff" stroke-width="20"/>
    
    <!-- Latch / Fastener -->
    <rect x="136" y="112" width="48" height="56" rx="10" fill="#facc15" stroke="#ffffff" stroke-width="8"/>
    
    <!-- Chest Base Container -->
    <path d="M16 168 L304 168 C315 168, 320 176, 316 188 L296 280 C292 296, 276 308, 260 308 L60 308 C44 308, 28 296, 24 280 L4 188 C0 176, 5 168, 16 168 Z" 
          fill="#1d4ed8" stroke="#ffffff" stroke-width="20" stroke-linejoin="round"/>

    <!-- Fast Accent Symbol (Spark / Bolt on Chest) -->
    <path d="M166 196 L144 246 L174 246 L154 290 L188 238 L158 238 Z" fill="#ffffff"/>
  </g>
</svg>
